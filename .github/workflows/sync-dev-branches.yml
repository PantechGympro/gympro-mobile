name: Sincronizar main -> dev

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configurar autor del merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fusionar main en dev
        run: |
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:dev
          else
            git merge --abort
            echo "::error title=Conflicto al sincronizar::main tiene cambios que chocan con dev. Resuélvelo a mano: git checkout dev && git merge main, resolver, git push."
            exit 1
          fi
